<!doctype html><html lang=ko><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<meta name=robots content="noindex,nofollow">
<title>사이트 업데이트</title>
<link rel=stylesheet href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f8fa;--card:#fff;--tx:#11131a;--sub:#6c7382;--line:#e4e7ee;
 --pri:#2b5ce6;--ok:#0a9d5a;--ok-bg:#e4f6ed;--err:#d1365a;--err-bg:#ffeaef}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d12;--card:#151922;--tx:#eceef3;
 --sub:#939bab;--line:#242936;--pri:#7ea2ff;--ok:#43d68d;--ok-bg:#10281d;
 --err:#ff7d9c;--err-bg:#2c1119}}
body{background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,sans-serif;
 padding:20px 16px 60px;line-height:1.6;font-size:15px}
.w{max-width:560px;margin:0 auto}
h1{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.lead{color:var(--sub);font-size:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:16px;margin-bottom:12px}
.f{margin-bottom:11px}
.f label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:5px}
input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);
 border-radius:10px;background:var(--bg);color:var(--tx)}
button{width:100%;font:inherit;font-size:16px;font-weight:700;padding:15px;border:0;
 border-radius:12px;background:var(--pri);color:#fff;cursor:pointer;margin-top:4px}
button:disabled{opacity:.55}
.list{font-size:13.5px;color:var(--sub)}
.list div{display:flex;justify-content:space-between;padding:7px 0;
 border-bottom:1px solid var(--line)}
.list div:last-child{border:0}
.st{font-weight:700}
.msg{border-radius:11px;padding:13px 15px;font-size:14px;font-weight:600;margin-top:12px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.err{background:var(--err-bg);color:var(--err)}
a{color:var(--pri);font-weight:600}
code{background:var(--bg);padding:2px 6px;border-radius:5px;font-size:13px}
</style></head><body><div class=w>

<h1>사이트 업데이트</h1>
<p class=lead>Claude가 만든 새 소스 파일을 GitHub에 반영합니다.
반영되면 자동 수집이 다시 돌면서 사이트가 갱신됩니다.</p>

<div class=card>
 <div class=list id=list></div>
</div>

<div class=card>
 <div class=f>
  <label>GitHub 토큰 (이 기기에만 저장됩니다)</label>
  <input id=tok type=password placeholder="github_pat_...">
 </div>
 <button id=go>GitHub에 반영하기</button>
 <div id=msg></div>
</div>

<h1 style="margin-top:26px;font-size:18px">자동 수집 상태</h1>
<p class=lead>GitHub Actions가 마지막으로 돈 결과입니다.</p>
<div class=card>
 <div id=runs class=list><div><span>토큰을 넣으면 표시됩니다</span></div></div>
 <button id=refresh style="background:var(--card);color:var(--pri);border:1px solid var(--line);margin-top:10px">상태 새로고침</button>
 <button id=run style="margin-top:8px;background:var(--card);color:var(--sub);border:1px solid var(--line)">지금 수집 실행하기 (토큰에 Actions 권한 필요)</button>
 <div id=msg2></div>
 <div id=fail></div>
</div>

<p class=lead style="margin-top:16px">토큰이 없거나 만료됐다면
<a href="https://github.com/settings/personal-access-tokens/new" target=_blank>여기서 새로 만들고</a>
저장소는 <code>ipo-site</code>, 권한은 <b>Contents: Read and write</b>를 주세요.</p>

<script id=payload type=application/json>{"repo": "Kim-beomjun-0112/ipo-site", "message": "홈 링크 수정 + update 페이지를 레포에 보존", "files": []}</script>
<script>
const P=JSON.parse(document.getElementById('payload').textContent);
const $=s=>document.querySelector(s);
const kb=n=>(n/1024).toFixed(1)+' KB';

if(!P.files.length){
 $('#list').innerHTML='<div><span>새로 반영할 파일이 없습니다. 아래에서 자동 수집 상태만 확인하세요.</span></div>';
 $('#go').disabled=true; $('#go').textContent='반영할 파일 없음';
}
$('#list').innerHTML=P.files.length?P.files.map(f=>
 `<div><span>${f.path}</span><span class=st id="s_${f.path.replace(/\W/g,'_')}">${kb(f.size)}</span></div>`
).join(''):$('#list').innerHTML;
$('#tok').value=localStorage.getItem('ipo_tok')||'';

function say(t,c){$('#msg').innerHTML=t?`<div class="msg ${c}">${t}</div>`:''}

$('#go').onclick=async()=>{
 const tok=$('#tok').value.trim();
 if(!tok){say('토큰을 입력해주세요.','err');return}
 localStorage.setItem('ipo_tok',tok);
 $('#go').disabled=true; say('반영 중… (한 번의 커밋으로 올립니다)','ok');
 const h={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json',
          'Content-Type':'application/json'};
 const api=(p,o)=>fetch(`https://api.github.com/repos/${P.repo}${p}`,{headers:h,...o});
 const ok=async r=>{if(!r.ok){const e=await r.json().catch(()=>({}));
   throw new Error(e.message||('HTTP '+r.status))} return r.json()};
 try{
  // 1) 현재 main 위치
  const ref=await ok(await api('/git/ref/heads/main'));
  const base=ref.object.sha;
  const baseCommit=await ok(await api('/git/commits/'+base));

  // 2) 파일마다 blob 생성
  const tree=[];
  for(const f of P.files){
   const cell=document.getElementById('s_'+f.path.replace(/\W/g,'_'));
   cell.textContent='올리는 중…';
   const b=await ok(await api('/git/blobs',{method:'POST',
     body:JSON.stringify({content:f.b64,encoding:'base64'})}));
   tree.push({path:f.path,mode:'100644',type:'blob',sha:b.sha});
   cell.textContent='준비 ✓';
  }

  // 3) 트리 → 커밋 → main 이동 (푸시 1회 = 실행 1회)
  say('커밋 만드는 중…','ok');
  const t=await ok(await api('/git/trees',{method:'POST',
    body:JSON.stringify({base_tree:baseCommit.tree.sha,tree})}));
  const c=await ok(await api('/git/commits',{method:'POST',
    body:JSON.stringify({message:P.message,tree:t.sha,parents:[base]})}));
  await ok(await api('/git/refs/heads/main',{method:'PATCH',
    body:JSON.stringify({sha:c.sha})}));

  P.files.forEach(f=>{
   const cell=document.getElementById('s_'+f.path.replace(/\W/g,'_'));
   if(cell) cell.textContent='완료 ✓';
  });
  say(`${P.files.length}개 파일을 커밋 하나로 반영했습니다.<br>`+
      `자동 수집이 곧 시작됩니다. 3~5분 뒤 아래 상태를 새로고침해 보세요.`,'ok');
 }catch(e){
  say('실패: '+e.message+'<br>토큰에 <b>Contents: Read and write</b> 권한이 있는지 확인해주세요.','err');
 }
 $('#go').disabled=false;
 setTimeout(loadRuns,8000);
};

function say2(t,c){$('#msg2').innerHTML=t?`<div class="msg ${c}">${t}</div>`:''}
const H=()=>({Authorization:'Bearer '+($('#tok').value.trim()||localStorage.getItem('ipo_tok')||''),
              Accept:'application/vnd.github+json'});

async function loadRuns(){
 const t=$('#tok').value.trim(); if(!t)return;
 $('#runs').innerHTML='<div><span>불러오는 중…</span></div>';
 try{
  const r=await fetch(`https://api.github.com/repos/${P.repo}/actions/runs?per_page=5`,{headers:H()});
  if(!r.ok) throw new Error((await r.json()).message||r.status);
  const runs=(await r.json()).workflow_runs||[];
  if(!runs.length){$('#runs').innerHTML='<div><span>아직 실행 기록이 없습니다</span></div>';return}
  const ico={success:'성공 ✓',failure:'실패 ✗',cancelled:'취소됨',skipped:'건너뜀',null:'진행 중…'};
  $('#runs').innerHTML=runs.map(x=>{
   const when=new Date(x.created_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
   const st=ico[x.conclusion]||x.status;
   const col=x.conclusion==='success'?'var(--ok)':x.conclusion==='failure'?'var(--err)':'var(--sub)';
   return `<div><span>${when}</span><span class=st style="color:${col}">${st}</span></div>`;
  }).join('');
  const bad=runs.find(x=>x.conclusion==='failure');
  if(bad) showFail(bad.id);
 }catch(e){ $('#runs').innerHTML=`<div><span>조회 실패: ${e.message}</span></div>` }
}

async function showFail(id){
 try{
  const r=await fetch(`https://api.github.com/repos/${P.repo}/actions/runs/${id}/jobs`,{headers:H()});
  if(!r.ok)return;
  const jobs=(await r.json()).jobs||[];
  const steps=(jobs[0]&&jobs[0].steps)||[];
  const f=steps.find(s=>s.conclusion==='failure');
  if(f) $('#fail').innerHTML='<div class="msg err">가장 최근 실패 단계: <b>'+f.name+
        '</b><br><a href="'+jobs[0].html_url+'" target=_blank>자세한 로그 보기 ↗</a></div>';
 }catch(e){}
}

$('#refresh').onclick=loadRuns;
$('#run').onclick=async()=>{
 const t=$('#tok').value.trim();
 if(!t){say2('토큰을 먼저 입력해주세요.','err');return}
 localStorage.setItem('ipo_tok',t);
 $('#run').disabled=true; say2('실행 요청 중…','ok');
 try{
  const r=await fetch(`https://api.github.com/repos/${P.repo}/actions/workflows/collect.yml/dispatches`,
   {method:'POST',headers:H(),body:JSON.stringify({ref:'main'})});
  if(r.status!==204){const e=await r.json().catch(()=>({}));throw new Error(e.message||r.status)}
  say2('실행을 요청했습니다. 3~5분 뒤 상태를 새로고침해 보세요.','ok');
  setTimeout(loadRuns,6000);
 }catch(e){ say2('실행 실패: '+e.message,'err') }
 $('#run').disabled=false;
};
if($('#tok').value) loadRuns();
</script></div></body></html>
