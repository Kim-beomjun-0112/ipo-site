<!doctype html>
<html lang=ko><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<meta name=robots content="noindex,nofollow">
<title>공모주 데이터 검수</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f7f9;--card:#fff;--tx:#16181d;--sub:#6b7280;--line:#e2e4e9;
 --pri:#1f5fd8;--warn:#c2410c;--warn-soft:#fff3ec;--ok:#0f9d58;--ok-soft:#e8f6ef}
@media(prefers-color-scheme:dark){:root{--bg:#0e1015;--card:#171a21;--tx:#e8eaee;
 --sub:#9aa1ad;--line:#272b34;--pri:#79a6ff;--warn:#fb923c;--warn-soft:#2a1a10;
 --ok:#4ade80;--ok-soft:#16281f}}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,
 "Apple SD Gothic Neo",sans-serif;line-height:1.55;padding:16px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:20px;letter-spacing:-.02em;margin-bottom:4px}
.lead{color:var(--sub);font-size:13.5px;margin-bottom:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
button{font:inherit;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:8px;
 border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;
 padding:14px;margin-bottom:10px}
.card.need{border-left:3px solid var(--warn)}
.card.ok{border-left:3px solid var(--ok)}
.nm{font-weight:700;font-size:15.5px}
.meta{color:var(--sub);font-size:12.5px;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;
 background:var(--warn-soft);color:var(--warn);margin:4px 4px 0 0}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.f{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-top:8px}
.f label{font-size:12.5px;color:var(--sub)}
input{font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);
 border-radius:7px;background:var(--bg);color:var(--tx);width:100%}
textarea{font:13px ui-monospace,monospace;width:100%;height:200px;padding:10px;
 border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx)}
.msg{font-size:13px;padding:9px 12px;border-radius:8px;margin:10px 0}
.msg.e{background:var(--warn-soft);color:var(--warn)}
.msg.s{background:var(--ok-soft);color:var(--ok)}
details{margin-top:14px}summary{cursor:pointer;font-size:13.5px;color:var(--sub)}
a{color:var(--pri)}
@media(max-width:560px){.f{grid-template-columns:1fr;gap:4px}}
</style></head><body><div class=wrap>

<h1>공모주 데이터 검수</h1>
<p class=lead>DART에서 자동으로 뽑지 못한 항목만 표시됩니다. 값을 채우고 저장하면
다음 빌드부터 사이트에 반영됩니다. 빈칸으로 두면 “확인 불가”로 나갑니다.</p>

<div class=bar>
 <button id=tgl>전체 보기</button>
 <button class=p id=save>GitHub에 저장</button>
 <button id=dl>파일로 내려받기</button>
 <span id=stat class=meta></span>
</div>
<div id=msg></div>
<div id=list></div>

<details>
 <summary>GitHub 저장 설정 (처음 한 번만)</summary>
 <div class=card>
  <p class=meta style="margin-bottom:8px">
   토큰은 이 브라우저에만 저장되고 서버로 보내지 않습니다.
   <a href="https://github.com/settings/personal-access-tokens/new" target=_blank>토큰 만들기</a> →
   Repository access에서 <b>ipo-site</b>만 선택 → Permissions에서 <b>Contents: Read and write</b> 체크
  </p>
  <div class=f><label>저장소</label><input id=repo placeholder="Kim-beomjun-0112/ipo-site"></div>
  <div class=f><label>토큰</label><input id=tok type=password placeholder="github_pat_..."></div>
  <div style="margin-top:10px"><button id=savecfg>설정 저장</button></div>
 </div>
</details>

<details>
 <summary>overrides.json 직접 보기</summary>
 <textarea id=raw readonly></textarea>
</details>

<script>
const NA='확인 불가';
const FIELDS=[
 ['sub_start','청약 시작일','2026-10-19'],
 ['sub_end','청약 종료일','2026-10-20'],
 ['pay_date','납입일','2026-10-22'],
 ['price_band','희망공모가','12300~16600'],
 ['final_price','확정공모가','15000'],
 ['listing_date','상장일','2026-10-29'],
 ['demand_rate','수요예측 경쟁률','1250.5'],
];
let items=[],ov={},showAll=false;

const $=s=>document.querySelector(s);
const cfg=()=>({repo:localStorage.getItem('ipo_repo')||'',tok:localStorage.getItem('ipo_tok')||''});
function say(t,cls){$('#msg').innerHTML=t?`<div class="msg ${cls||''}">${t}</div>`:''}

(function initCfg(){const c=cfg();$('#repo').value=c.repo;$('#tok').value=c.tok})();
$('#savecfg').onclick=()=>{
 localStorage.setItem('ipo_repo',$('#repo').value.trim());
 localStorage.setItem('ipo_tok',$('#tok').value.trim());
 say('설정을 저장했습니다.','s');
};

async function load(){
 try{
  const d=await (await fetch('../ipos.json?'+Date.now())).json();
  items=d.items||[];
 }catch(e){ say('ipos.json을 읽지 못했습니다. 사이트가 빌드된 뒤에 열어주세요.','e'); return }
 const c=cfg();
 if(c.repo&&c.tok){
  try{
   const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/data/overrides.json`,
     {headers:{Authorization:'Bearer '+c.tok,Accept:'application/vnd.github+json'}});
   if(r.ok){const j=await r.json();ov=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}
  }catch(e){}
 }
 render();
}

function render(){
 const need=items.filter(r=>(r.missing||[]).length&&!r.is_spac);
 const show=showAll?items:need;
 $('#stat').textContent=`검수 필요 ${need.length}건 / 전체 ${items.length}건`;
 $('#tgl').textContent=showAll?'검수 필요만 보기':'전체 보기';
 $('#list').innerHTML=show.map(card).join('')||'<div class=card>검수할 항목이 없습니다. 👍</div>';
 $('#raw').value=JSON.stringify(ov,null,1);
 show.forEach(r=>FIELDS.forEach(([k])=>{
   const el=document.getElementById(`i_${r.corp_code}_${k}`);
   if(el) el.oninput=()=>{
     const v=el.value.trim();
     ov[r.corp_code]=ov[r.corp_code]||{};
     if(v) ov[r.corp_code][k]=(k==='price_band'&&v.includes('~'))
        ? v.split('~').map(x=>parseInt(x.replace(/\D/g,''),10))
        : (k==='final_price'?parseInt(v.replace(/\D/g,''),10):v);
     else delete ov[r.corp_code][k];
     if(!Object.keys(ov[r.corp_code]).length) delete ov[r.corp_code];
     $('#raw').value=JSON.stringify(ov,null,1);
   };
 }));
}

function card(r){
 const miss=r.missing||[];
 const cur=ov[r.corp_code]||{};
 const tags=miss.length?miss.map(m=>`<span class=tag>${m}</span>`).join('')
   :'<span class="tag ok">완전 추출</span>';
 const fields=FIELDS.map(([k,label,ph])=>{
   const v=cur[k]!=null?(Array.isArray(cur[k])?cur[k].join('~'):cur[k]):'';
   const auto=r[k]!=null?(Array.isArray(r[k])?r[k].join('~'):r[k]):'';
   return `<div class=f><label>${label}${auto?` <span style="opacity:.6">(자동: ${auto})</span>`:''}</label>
    <input id="i_${r.corp_code}_${k}" value="${v}" placeholder="${auto||ph}"></div>`;
 }).join('');
 return `<div class="card ${miss.length?'need':'ok'}">
  <div class=nm>${r.corp_name}</div>
  <div class=meta>${r.market||''} · ${r.rcept_dt} ${r.report_nm}
   · <a href="${r.dart_url}" target=_blank>DART 원문 열기 ↗</a></div>
  <div>${tags}</div>${fields}</div>`;
}

$('#tgl').onclick=()=>{showAll=!showAll;render()};
$('#dl').onclick=()=>{
 const b=new Blob([JSON.stringify(ov,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download='overrides.json';a.click();
 say('내려받은 파일을 GitHub의 <b>data/overrides.json</b> 에 올리면 됩니다.','s');
};

$('#save').onclick=async()=>{
 const c=cfg();
 if(!c.repo||!c.tok){say('먼저 아래 “GitHub 저장 설정”에서 저장소와 토큰을 입력해주세요.','e');return}
 $('#save').disabled=true;say('저장 중…');
 try{
  const url=`https://api.github.com/repos/${c.repo}/contents/data/overrides.json`;
  const h={Authorization:'Bearer '+c.tok,Accept:'application/vnd.github+json'};
  let sha=null;
  const g=await fetch(url,{headers:h});
  if(g.ok) sha=(await g.json()).sha;
  const body={message:'검수 데이터 업데이트',
    content:btoa(unescape(encodeURIComponent(JSON.stringify(ov,null,1))))};
  if(sha) body.sha=sha;
  const r=await fetch(url,{method:'PUT',headers:h,body:JSON.stringify(body)});
  if(!r.ok) throw new Error((await r.json()).message||r.status);
  say('저장했습니다. 다음 자동 수집(매일 07시·18시) 때 사이트에 반영됩니다.','s');
 }catch(e){ say('저장 실패: '+e.message,'e') }
 $('#save').disabled=false;
};

load();
</script></div></body></html>
